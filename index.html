<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start Co-Browse Session</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    }

    .card {
      background: #181c25;
      border: 1px solid #2a3040;
      border-radius: 12px;
      padding: 40px;
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      text-align: center;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #e8eaf0;
    }

    p {
      font-size: 13px;
      color: #7a8299;
      line-height: 1.6;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: #4f7cff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: #3d6be0; }
    .btn:disabled { background: #1d2d5a; color: #4a5a8a; cursor: not-allowed; }

    /* PIN display — hidden until session starts */
    .pin-block {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: #1e2330;
      border: 1px solid #2a3040;
      border-radius: 8px;
      padding: 24px 20px;
    }

    .pin-block.visible { display: flex; }

    .pin-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7a8299;
    }

    .pin-digits {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #4f7cff;
      font-variant-numeric: tabular-nums;
    }

    .pin-instruction {
      font-size: 13px;
      color: #7a8299;
      line-height: 1.5;
    }

    .pin-instruction strong {
      color: #e8eaf0;
      font-weight: 500;
    }

    .status {
      font-size: 12px;
      color: #7a8299;
      min-height: 16px;
    }

    .status.active  { color: #2dbd7a; }
    .status.warn    { color: #f0a432; }
    .status.error   { color: #e24b4a; }
    .status.host    { color: #a78bfa; }
  </style>
</head>
<body>

<div class="card">
  <div>
    <h1>Start Co-Browse Session</h1>
  </div>

  <p>Click the button below to start a session. Share the PIN with your agent to let them join.</p>

  <button class="btn" id="btn-start" onclick="launch()">Start Session</button>

  <div class="pin-block" id="pin-block">
    <div class="pin-label">Share this PIN with your agent</div>
    <div class="pin-digits" id="pin-display">—</div>
    <div class="pin-instruction">
      Read this PIN to your agent.<br/>
      They will join and take over <strong>automatically</strong>.
    </div>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status' + (type ? ' ' + type : '');
  }

  function launch() {
    document.getElementById('btn-start').disabled = true;
    setStatus('Loading...');

    window.Surfly = window.Surfly || {
      init:    function () { window.Surfly.q = arguments; },
      on:      function () { window.Surfly.e = (window.Surfly.e || []).concat([arguments]); },
      session: function () { window.Surfly.s = (window.Surfly.s || []).concat([arguments]); }
    };

    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://surfly.com/surfly.js';
    script.onload  = function () { init(); };
    script.onerror = function () {
      setStatus('Failed to load Surfly SDK.', 'error');
      document.getElementById('btn-start').disabled = false;
    };
    document.head.appendChild(script);
  }

  function init() {
    Surfly.init({ widget_key: 'd01c1280d1f64e04b6303b49802e209c' }, function (e) {
      if (!e.success) {
        setStatus('Init failed: ' + (e.errorMsg || 'unknown'), 'error');
        document.getElementById('btn-start').disabled = false;
        return;
      }

      if (Surfly.isInsideSession) return;

      const session = Surfly.session({
        non_hosts_can_open_tabs: false
      });

      // PIN becomes available at session_created / session_queued
      function showPin(sess) {
        const pin = sess.pin;
        if (!pin) return;
        document.getElementById('pin-display').textContent = pin;
        document.getElementById('pin-block').classList.add('visible');
        document.getElementById('btn-start').style.display = 'none';
        setStatus('Waiting for agent to join...', 'warn');
      }

      session.on('session_created', function (sess) { showPin(sess); });
      session.on('session_queued',  function (sess) { showPin(sess); });
      session.on('session_started', function (sess) { showPin(sess); });

      // Guard prevents double-firing since both viewer_joined AND
      // participant_joined fire for the same person joining via PIN.
      // Delay gives Surfly time to register the participant internally
      // before makeHost() is called — calling it immediately throws
      // "Client index N not found in participants".
      let hostTransferred = false;

      function transferHost(clientIndex) {
        if (hostTransferred) {
          console.log('[Surfly] transferHost skipped — already transferred');
          return;
        }
        hostTransferred = true;
        setStatus('Agent joined — transferring control...', 'warn');
        console.log('[Surfly] transferHost — clientIndex:', clientIndex, '— waiting 800ms before makeHost...');

        setTimeout(function () {
          try {
            console.log('[Surfly] calling makeHost(' + clientIndex + ')');
            session.makeHost(clientIndex);
          } catch (err) {
            console.error('[Surfly] makeHost error:', err.message);
            setStatus('Transfer error: ' + err.message, 'error');
            hostTransferred = false;
          }
        }, 800);
      }

      session.on('viewer_joined', function (sess, event) {
        console.log('[Surfly] viewer_joined — clientIndex:', event.clientIndex, 'count:', event.count);
        transferHost(event.clientIndex);
      });

      session.on('participant_joined', function (sess, event) {
        console.log('[Surfly] participant_joined — clientIndex:', event.clientIndex, 'userData:', event.userData);
        transferHost(event.clientIndex);
      });

      // Confirm transfer
      session.on('host_changed', function (sess, event) {
        console.log('[Surfly] host_changed — to:', event.to, 'gained:', event.gained, 'myIndex:', event.myIndex);
        if (!event.gained) {
          setStatus('Agent is now in control.', 'host');
          document.querySelector('.pin-instruction').textContent = 'Your agent has joined and is now in control.';
        }
      });

      session.on('session_ended', function () {
        setStatus('Session ended.');
        document.getElementById('pin-block').classList.remove('visible');
        document.getElementById('btn-start').style.display = 'block';
        document.getElementById('btn-start').disabled = false;
        document.getElementById('pin-display').textContent = '—';
      });

      session.on('error', function (sess, ev) {
        console.error('[Surfly] session error:', ev);
        setStatus('Error: ' + (ev.reason || 'unknown'), 'error');
        document.getElementById('btn-start').disabled = false;
      });

      session.startLeader();
    });
  }
</script>

</body>
</html>
