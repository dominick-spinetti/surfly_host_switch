<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surfly Session Launch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    }

    .card {
      background: #181c25;
      border: 1px solid #2a3040;
      border-radius: 12px;
      padding: 40px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #e8eaf0;
    }

    label {
      display: block;
      font-size: 11px;
      color: #7a8299;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select {
      width: 100%;
      background: #141720;
      border: 1px solid #2a3040;
      border-radius: 6px;
      padding: 9px 12px;
      color: #e8eaf0;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    select:focus { border-color: #4f7cff; }

    .btn {
      width: 100%;
      padding: 12px;
      background: #4f7cff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: #3d6be0; }
    .btn:disabled { background: #1d2d5a; color: #4a5a8a; cursor: not-allowed; }

    .status {
      font-size: 12px;
      color: #7a8299;
      text-align: center;
      min-height: 18px;
    }

    .status.active { color: #2dbd7a; }
    .status.error  { color: #e24b4a; }
  </style>
</head>
<body>

<div class="card">
  <h1>Start Cobrowse Session</h1>

  <div>
    <label>Widget Key</label>
    <select id="widget-key">
      <option value="">— Select —</option>
      <option value="d01c1280d1f64e04b6303b49802e209c">ONE Demo</option>
    </select>
  </div>

  <button class="btn" id="btn-start" onclick="launch()">Start Session</button>

  <div class="status" id="status"></div>
</div>

<script>
  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status' + (type ? ' ' + type : '');
  }

  function launch() {
    const widgetKey = document.getElementById('widget-key').value;
    if (!widgetKey) { setStatus('Please select a widget key.', 'error'); return; }

    document.getElementById('btn-start').disabled = true;
    setStatus('Loading Surfly...');

    // Set up stub so surfly.js has something to augment on load
    window.Surfly = window.Surfly || {
      init:    function () { window.Surfly.q = arguments; },
      on:      function () { window.Surfly.e = (window.Surfly.e || []).concat([arguments]); },
      session: function () { window.Surfly.s = (window.Surfly.s || []).concat([arguments]); }
    };

    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://surfly.com/surfly.js';
    script.onload = function () { init(widgetKey); };
    script.onerror = function () {
      setStatus('Failed to load Surfly SDK.', 'error');
      document.getElementById('btn-start').disabled = false;
    };
    document.head.appendChild(script);
  }

  function init(widgetKey) {
    Surfly.init({ widget_key: widgetKey }, function (e) {
      if (!e.success) {
        setStatus('Init failed: ' + (e.errorMsg || 'unknown error'), 'error');
        document.getElementById('btn-start').disabled = false;
        return;
      }

      if (Surfly.isInsideSession) return;

      setStatus('Starting session...');

      const session = Surfly.session({ non_hosts_can_open_tabs: false });

      session.on('session_started', function () {
        setStatus('Session active.', 'active');
      });

      session.on('session_ended', function () {
        setStatus('Session ended.');
        document.getElementById('btn-start').disabled = false;
      });

      session.on('error', function (sess, ev) {
        setStatus('Error: ' + (ev.reason || 'unknown'), 'error');
        document.getElementById('btn-start').disabled = false;
      });

      session.startLeader();
    });
  }
</script>

</body>
</html>
